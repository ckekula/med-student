[project]
name = "backend"
version = "0.1.0"
description = "A FastAPI backend for the application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "jwt>=1.4.0",
    "llama-index>=0.14.24",
    "llama-parse>=0.6.94",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
